name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Security advisories
        run: composer audit
      - name: Static analysis
        run: composer stan
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: composer test

  mutation:
    # Mutation score ratchet: `composer mutate` carries the current floor
    # (--min). Raise it whenever the score goes up; never lower it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Mutation testing
        run: composer mutate
